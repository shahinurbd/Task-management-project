<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

</head>
<body>
    <div class="w-1/2 mx-auto mt-10">
        <div>
            {% if message %}
                <p>{{message}}</p>
            {% endif %}
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-rose-600 p-2 text-white rounded-lg mt-4">Submit</button>
        </form>
    </div>
</body>
</html>
